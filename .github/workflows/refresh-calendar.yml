name: Refresh SVSC Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendar
        run: python build_calendar.py

      - name: Add simple landing page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>SVSC Calendar</title></head>
          <body>
            <h1>SVSC Calendar</h1>
            <p><a href="svsc.ics">SVSC iCalendar feed</a></p>
            <p>Generated automatically from the public Scotts Valley Sportsmen's Club event calendar.</p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
